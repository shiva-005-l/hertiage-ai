stages:
  - audit
  - quality
  - test
  - build
  - security

variables:
  HUSKY: "0"
  NPM_CONFIG_CACHE: "$CI_PROJECT_DIR/.npm"

cache:
  key:
    files:
      - frontend/package-lock.json
  paths:
    - .npm/_cacache/

default:
  image: node:20
  interruptible: true
  before_script:
    - npm --prefix frontend ci --no-audit --prefer-offline

dependency_audit:
  stage: audit
  script:
    - npm --prefix frontend audit --audit-level=moderate

quality:
  stage: quality
  script:
    - npm run lint
    - npm run check:format
    - npm run biome
    - npm run oxlint
    - npm run deadcode

type_check:
  stage: quality
  script:
    - npm run type-check

test:
  stage: test
  script:
    - npm run test:ci
    - npm run coverage

build_compile:
  stage: build
  script:
    - npm run build:ci

secret_scanning:
  stage: security
  script:
    - npm run security
