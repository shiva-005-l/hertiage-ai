stages:
  - audit
  - lint
  - format
  - type_check
  - test
  - security

cache:
  paths:
    - node_modules/

default:
  image: node:20
  tags:
    - smart-heritage-node20
  before_script:
    - npm ci

dependency_audit:
  stage: audit
  script:
    - npm audit

lint:
  stage: lint
  script:
    - npm run lint
    - npm run check:format
    - npm run biome
    - npm run oxlint
    - npm run deadcode

format:
  stage: format
  script:
    - npm run check:format

type_check:
  stage: type_check
  script:
    - npm run type-check

test:
  stage: test
  script:
    - npm run test:ci
    - npm run coverage

secret_scanning:
  stage: security
  script:
    - npm run security


